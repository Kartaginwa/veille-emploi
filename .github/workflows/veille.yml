name: Veille emploi
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC (4 h à Montréal en heure d'été)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node veille.mjs
        continue-on-error: true
      - name: Publier les résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Veille $(date -u +%F)"
          git push
